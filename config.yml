# Moss & Moon — manually editable configuration
# UTF-8, 2 spaces per level, never TAB. Save numbers without quotes.
# Published files and all comments are visible to site visitors.

# GENERAL CONFIGURATION — does not contain the shops.
# Interface labels are in English; comments are only for editors.
config:
  name: Moss & Moon
  title: The community directory
  # Document language; does not automatically translate interface text.
  language: en
  # Address displayed and copied. The site does NOT query server status.
  serverAddress: play.moss-n-moon.me
  # Path relative to index.html, not to this file.
  logo: assets/logo.png
  # Real listings are transcribed from supplied announcements, not live server data.
  demoMode: false
  # Default currency when not specified in an individual shop.
  # Values: diamond (diamonds) | diamond_block (diamond blocks).
  # Priority: item > shop > this setting. No price conversion.
  currency: diamond
  # Local favorites identifier. Keep it stable to avoid losing them.
  storageKey: moss-moon-directory-v1
  # Enter real https://... URLs or leave '' (empty). No tokens or passwords.
  links:
    discord: ''
    store: ''
    repository: ''
  # Introductory panel text. Quote text containing : or #.
  hero:
    eyebrow: A WORLD OF PLAYER-MADE POSSIBILITIES
    title: Small shops.
    accent: Great discoveries.
    description: Find the blocks, little treasures, and helping hands for your next adventure. All
      in one corner of Moss & Moon.
  # Suggested searches below the search bar. They do not add items to the catalog.
  popular:
    - Wool
    - Mending
    - Pale oak
    - Building services
  # Cards in the "How it works" section.
  guide:
    - icon: search
      title: Find your thing
      text: Search for an item, a shop, or a service. Narrow it down by category and location.
    - icon: pin
      title: Plan a little visit
      text: Open a shop to see its listings, prices, and directions. Copy the coordinates for your
        journey.
    - icon: heart
      title: Keep the good ones
      text: Save your favourite shops on this device. Purchases and trades happen in Minecraft,
        not here.
  # Frequently asked questions. Update references to demo data before publishing.
  faq:
    - question: Can I buy items on this website?
      answer: No. This is a community directory, not an online checkout. Visit a shop in Minecraft
        and follow its owner’s trading instructions. No real-money purchases take place here.
    - question: Are prices and stock live?
      answer: No. These are manually maintained listings. The owner’s in-game signs are the source
        of truth. Listings are transcribed from owner announcements and are not live stock checks.
    - question: How do I add or update my shop?
      answer: Use “List your shop” to prepare a YAML (.yml) listing file. Download it and send it
        to the directory maintainers through your community’s normal channel. Nothing is submitted
        or published automatically.
    - question: Where are my saved shops stored?
      answer: Only in your browser’s local storage on this device. There is no account, tracking,
        or cross-device sync. Your browser may clear this data; private browsing and local-file
        storage can behave differently.

# CATEGORIES — use these IDs in each shop's categories: field.
# Add a category here before using it in shops.
categories:
  - id: building
    name: Building blocks
    icon: blocks
    description: Every build starts with a block.
  - id: nature
    name: Wood & greenery
    icon: leaf
    description: A little more life for your world.
  - id: redstone
    name: Redstone & tech
    icon: circuit
    description: For clever little contraptions.
  - id: equipment
    name: Gear & enchantments
    icon: book
    description: A better-equipped adventure.
  - id: farming
    name: Food & farming
    icon: wheat
    description: Supplies to keep you growing.
  - id: travel
    name: Travel & exploration
    icon: compass
    description: Your next destination awaits.
  - id: services
    name: Player services
    icon: tools
    description: A helping hand from the community.
  - id: collectibles
    name: Art & collectibles
    icon: book
    description: Music discs, map art and collectible creations.

# LOCATIONS — use these IDs in each shop's location: field.
# The dimension is descriptive: it does not teleport or convert coordinates.
locations:
  - id: district
    name: Ancient Alley
    short: Ancient Alley
    dimension: Overworld
    icon: store
  - id: spawn
    name: Spawn & surroundings
    short: Near spawn
    dimension: Overworld
    icon: sprout
  - id: nether
    name: Nether roof
    short: Nether roof
    dimension: The Nether
    icon: portal
