# MOSS & MOON — SHOP LISTING
# FICTIONAL EXAMPLE: names, prices, stock and coordinates are not verified data.
# Edit only this file to update this shop.
# Lines starting with # are comments for you and do not appear in the interface.
# Use spaces (2 per level), never TAB. Keep indentation and save as UTF-8.
# You can quote text and use >- for long text spanning multiple lines.
#
# IDENTITY
# id: unique throughout the directory, lowercase letters/numbers/hyphens. Keep it stable:
#     it is used in links and favorites. Changing the display name is safe.
# name: public name; owner: the owner's Minecraft username.
id: builders-bench
name: The Builder’s Bench
owner: MapleMason

# PRESENTATION
# tagline: short phrase on the card; description: full description in the dialog.
tagline: A helping hand. A better build.
description: >-
  A second pair of hands for your next project. From a cozy starter home to the landscape
  around it, let’s make something yours.

# CLASSIFICATION
# kind: shop | stall | service. This choice changes labels and filters.
# categories: one or more IDs defined in config.yml (not display names).
# location: ID of a location defined in config.yml.
kind: service
categories:
  - services
location: district

# POSITION — integers, including negative values. Do not enter the dimension here:
# the dimension comes from the location selected above.
coords:
  x: 96
  y: 64
  z: -112
# Directions to the shop; no automatic commands or teleportation.
directions: >-
  Follow the main path from the district entrance. These are demonstration coordinates;
  replace them with the real route before publishing.

# STATUS AND VISIBILITY
# status: open (active) | paused (on hold) | unverified (not verified).
# All three remain VISIBLE when the file is listed in shops/index.yml.
# "Listed as in stock" excludes shops whose status is not open.
# demo: true shows the sample badge; use false only for an approved real listing.
# featured: true moves the card to the top in "Featured first" sorting.
# updated: last manual check, YYYY-MM-DD; the date does not update automatically.
status: open
demo: true
featured: false
updated: '2026-10-09'

# DEFAULT CURRENCY FOR THIS SHOP
# diamond = diamonds; diamond_block = diamond blocks.
# You can choose a different currency for each item. No automatic conversion.
currency: diamond_block

# APPEARANCE AND NOTES (optional)
# theme: illustration used when images is empty. Examples:
# wool, pale, books, redstone, garden, food, builder, stone, ocean, crystal, travel, welcome.
# tags: short labels; use [] for no labels.
# notes: message from the shopkeeper; may be empty, e.g. notes: "".
theme: builder
tags:
  - Custom builds
  - Landscaping
notes: Service prices depend on the project. Contact the owner in-game to agree on scope and payment
  before work begins.

# PHOTOS — paths are relative to index.html, NOT to the .yml file.
# images: [] keeps the illustration. To add photos, replace it with:
# images:
#   - src: assets/shops/builders-bench/front.webp
#     alt: "Front of the shop"
#   - src: assets/shops/builders-bench/inside.webp
#     alt: "Inside the shop"
# Place the actual image files at the specified paths before publishing.
images: []

# INVENTORY — add a "- id: ..." block for each item or service.
# id: unique identifier WITHIN THE SHOP, e.g. black_wool or minecraft:black_wool.
# name: readable name; it does not need to match Minecraft exactly.
# price: cost of the ENTIRE batch specified by quantity, not a single item.
#        Use a number (e.g. 1 or 1.5), 0 for free, null for "Ask owner".
#        Do not write "1 diamond" or use a decimal comma.
# currency: optional on an item; overrides the shop's currency.
#           diamond = diamonds; diamond_block = diamond blocks.
#           The price value is displayed as written: it is NOT converted.
# quantity: number of items/services sold at that price, integer >= 1.
# unit: text displayed after quantity, e.g. items, item, project; if omitted,
#       the site uses item for quantity: 1, otherwise items.
# stock: in (available), low (few left), out (sold out), unknown (ask the owner).
#        If omitted: unknown. This is a manual statement, NOT live data.
# icon: cube, wool, log, resin, leaf, book, redstone, machine, tools, etc.
#       If omitted, cube is used. Icons are illustrations, not game textures.
# aliases: alternative search terms; optional, defaults to [].
# color: optional for the wool icon, e.g. "#e7e5df"; quotes are required.
items:
  - id: building_service
    name: Building services
    price: null
    quantity: 1
    unit: project
    stock: in
    icon: tools
    aliases:
      - builder
      - custom builds
      - houses
  - id: terraforming_service
    name: Terraforming
    price: null
    quantity: 1
    unit: project
    stock: in
    icon: leaf
    aliases:
      - landscaping
      - terrain
  - id: interior_service
    name: Interior design
    price: null
    quantity: 1
    unit: project
    stock: low
    icon: tools
    aliases:
      - decoration
      - decorating
