# LIST OF SHOPS TO LOAD
# Each shop's information is stored in its own .yml file.
# To add a shop:
# 1. Copy docs/shop-template.yml to shops/shop-name.yml.
# 2. Fill in the file (also change id and all sample data).
# 3. Add below: - shop-name.yml
# 4. Publish your changes. No JavaScript files need editing.
#
# Filenames are relative to shops/: do NOT write shops/shop-name.yml.
# Use lowercase letters, numbers, hyphens or underscores; the extension is .yml or .yaml.
# Filenames are case-sensitive on servers.
# Unlisted files are NOT loaded, but remain accessible by URL if published.
# For an empty directory, use: shops: []
# This is the initial order; "Featured first" moves shops with featured: true to the top.
# Includes five example shops and a complete Minecraft preview test catalog.

shops:
  - woolery.yml
  - pale-found.yml
  - moonbound.yml
  - circuit.yml
  - builders-bench.yml
  - preview-test.yml
