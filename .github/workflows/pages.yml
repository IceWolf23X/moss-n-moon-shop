# YAML files are served unchanged. This workflow validates and copies; it does not generate HTML.
# Optional. Enable Settings > Pages > Source: GitHub Actions in your repository.
# Upload this project's CONTENTS to the root of a repository with a main branch.
name: Validate and deploy directory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node for tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core, YAML, and HTTP tests
        run: node --test tests/*.test.cjs
      - name: Validate the current catalog
        run: node tests/validate-data.cjs
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp index.html config.yml _site/
          cp -R assets css js shops _site/
          touch _site/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
